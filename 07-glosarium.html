<!-- 07 GLOSARIUM MINI ISTILAH JEPANG -->
    <section id="glosarium" class="reveal">
      <div class="sec-header">
        <div class="sec-index">07 · Glosarium<span>用語集</span></div>
        <div>
          <h2 class="sec-title">Kamus Mini Istilah Omamori</h2>
        </div>
      </div>

      <div class="glossary-grid" id="glossaryGrid">
        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Omamori</span>
            <span class="gloss-jp">お守り</span>
          </div>
          <span class="gloss-read">Baca: o-ma-mo-ri</span>
          <p class="gloss-def">Jimat pelindung tradisional dari kuil Shinto maupun Buddha; berasal dari kata <em>mamoru</em> (melindungi).</p>
        </button>

        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Ofuda</span>
            <span class="gloss-jp">お札</span>
          </div>
          <span class="gloss-read">Baca: o-fu-da</span>
          <p class="gloss-def">Lembaran kertas atau jimat doa suci yang menjadi inti berkah di dalam kantong kain omamori.</p>
        </button>

        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Kifuda</span>
            <span class="gloss-jp">木札</span>
          </div>
          <span class="gloss-read">Baca: ki-fu-da</span>
          <p class="gloss-def">Papan kayu tipis bertuliskan nama dewa atau kaligrafi doa yang disimpan di dalam omamori tradisional.</p>
        </button>

        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Jinja &amp; Otera</span>
            <span class="gloss-jp">神社・お寺</span>
          </div>
          <span class="gloss-read">Baca: jin-ja / o-te-ra</span>
          <p class="gloss-def"><em>Jinja</em> adalah kuil Shinto dan <em>otera</em> adalah kuil Buddha. Keduanya sama-sama menerbitkan omamori di Jepang.</p>
        </button>

        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Nijūkanō-musubi</span>
            <span class="gloss-jp">二重叶結び</span>
          </div>
          <span class="gloss-read">Baca: ni-jū-ka-nō mu-su-bi</span>
          <p class="gloss-def">Simpul tali khas di bagian atas omamori yang melambangkan harapan agar doa pemiliknya terkabul.</p>
        </button>

        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Otakiage</span>
            <span class="gloss-jp">お焚き上げ</span>
          </div>
          <span class="gloss-read">Baca: o-ta-ki-a-ge</span>
          <p class="gloss-def">Upacara pembakaran suci di kuil untuk mengembalikan omamori setelah sekitar satu tahun sebagai tanda terima kasih.</p>
        </button>

        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Yakudoshi</span>
            <span class="gloss-jp">厄年</span>
          </div>
          <span class="gloss-read">Baca: ya-ku-do-shi</span>
          <p class="gloss-def">Tahun atau usia tertentu dalam kepercayaan Jepang yang dianggap rentan kesialan, saat orang kerap membawa <em>yakuyoke</em>.</p>
        </button>

        <button type="button" class="gloss-card">
          <div class="gloss-top">
            <span class="gloss-term">Magatama</span>
            <span class="gloss-jp">勾玉</span>
          </div>
          <span class="gloss-read">Baca: ma-ga-ta-ma</span>
          <p class="gloss-def">Manik batu berbentuk koma sejak era Jomon yang diyakini sebagai cikal bakal benda pelindung di Jepang.</p>
        </button>
      </div>
